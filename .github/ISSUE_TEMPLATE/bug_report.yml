name: Bug Report
description: Report a bug or issue with the VST Test Playground
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide detailed information to help us fix it.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
      placeholder: Describe what happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe the actual behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide steps to reproduce the bug
      placeholder: |
        1. Build the project with...
        2. Open the plugin in...
        3. Adjust parameter...
        4. Observe error...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - Audio Processing (PluginProcessor)
        - GUI (PluginEditor)
        - WebView Integration
        - Parameter Management
        - Build System
        - Tests
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you using?
      options:
        - Windows
        - macOS
        - Linux
        - Multiple platforms
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin Version
      description: What version of the plugin are you using?
      placeholder: e.g., 1.0.0 or commit hash

  - type: input
    id: daw
    attributes:
      label: DAW
      description: Which DAW are you using (if applicable)?
      placeholder: e.g., Reaper 7.0, Ableton Live 12, etc.

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical (crashes, data loss)
        - High (major functionality broken)
        - Medium (workaround available)
        - Low (cosmetic or minor issue)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or Error Messages
      description: Include any relevant logs, error messages, or stack traces
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem (screenshots, system info, etc.)
