name: Feature Request
description: Propose a new feature or enhancement for the VST Test Playground
title: "[Feature]: "
labels: ["enhancement", "feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request! Please provide as much detail as possible.

  - type: input
    id: feature-name
    attributes:
      label: Feature Name
      description: A clear, concise name for the feature
      placeholder: e.g., "WebView Parameter Automation"
    validations:
      required: true

  - type: dropdown
    id: epic
    attributes:
      label: Related Epic
      description: Which epic does this feature belong to?
      options:
        - Core Audio Processing
        - WebView UI Enhancement
        - Parameter Management
        - Testing Infrastructure
        - Build System
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What user problem or business need does this feature address?
      placeholder: Describe the problem this feature solves (3-5 sentences)
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Explain how this feature would solve the problem
      placeholder: Describe your proposed solution
    validations:
      required: true

  - type: textarea
    id: user-stories
    attributes:
      label: User Stories
      description: Describe the user stories for this feature
      placeholder: |
        - As a plugin developer, I want to... so that I can...
        - As a plugin user, I want to... so that I can...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What needs to be true for this feature to be considered complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: true

  - type: textarea
    id: technical-notes
    attributes:
      label: Technical Notes
      description: Any technical considerations, dependencies, or constraints
      placeholder: Technical details, architecture considerations, dependencies

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples about the feature request
