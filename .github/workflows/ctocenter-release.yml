name: CTO Center Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  generate-release-artifacts:
    runs-on: ubuntu-latest
    name: Generate Release Documentation
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install TypeScript
        run: npm install -g typescript ts-node @types/node
      
      - name: Extract version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Get previous tag
        id: previous-tag
        run: |
          PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"
      
      - name: Generate changelog
        run: |
          cd .ctocenter/scripts
          if [ -n "${{ steps.previous-tag.outputs.previous_tag }}" ]; then
            ts-node changelog.ts --from ${{ steps.previous-tag.outputs.previous_tag }} --to v${{ steps.version.outputs.version }}
          else
            ts-node changelog.ts --to v${{ steps.version.outputs.version }}
          fi
      
      - name: Generate release notes
        run: |
          cd .ctocenter/scripts
          ts-node release-notes.ts ${{ steps.version.outputs.version }}
      
      - name: Update TOC in documentation
        run: |
          cd .ctocenter/scripts
          ts-node toc-sync.ts --all
      
      - name: Generate CI summary
        run: |
          cd .ctocenter/scripts
          ts-node ci-summary.ts
      
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-v${{ steps.version.outputs.version }}
          path: |
            CHANGELOG.md
            docs/releases/v${{ steps.version.outputs.version }}.md
            .ctocenter/state/ci-summary.md
          retention-days: 90
      
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = '${{ steps.version.outputs.version }}';
            const releaseNotesPath = `docs/releases/v${version}.md`;
            
            let body = 'Release notes generation in progress...';
            
            if (fs.existsSync(releaseNotesPath)) {
              body = fs.readFileSync(releaseNotesPath, 'utf8');
            }
            
            try {
              const release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: `v${version}`,
                name: `Release v${version}`,
                body: body,
                draft: true,
                prerelease: version.includes('alpha') || version.includes('beta') || version.includes('rc')
              });
              
              console.log(`Created draft release: ${release.data.html_url}`);
            } catch (error) {
              console.error('Failed to create release:', error);
              throw error;
            }
      
      - name: Commit updated documentation
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CHANGELOG.md docs/releases/ .ctocenter/
          git commit -m "docs: update release documentation for v${{ steps.version.outputs.version }}" || echo "No changes to commit"
      
      - name: Push changes
        if: github.event_name == 'workflow_dispatch'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
      
      - name: Summary
        run: |
          echo "🎉 Release artifacts generated for v${{ steps.version.outputs.version }}"
          echo ""
          echo "Generated files:"
          echo "- CHANGELOG.md"
          echo "- docs/releases/v${{ steps.version.outputs.version }}.md"
          echo "- .ctocenter/state/ci-summary.md"
          echo ""
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "✅ Draft GitHub release created"
            echo "📝 Review and publish the release in the GitHub UI"
          fi
